name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, builds and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate the delivery backlog
        run: python3 scripts/validate_backlog.py

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build the web app and bundle the API
        # The API is bundled here, where the whole workspace exists. SWA builds api/ alone and cannot resolve the contracts package, so the deploy step ships dist/.
        run: |
          pnpm --filter @pagelet/web run build
          pnpm --filter pagelet-api run bundle

      - name: Unit tests
        run: pnpm -r --if-present run test

      - name: Integration tests against embedded PostgreSQL
        run: pnpm --filter @pagelet/tests run test:integration

      - name: Confirm the production bundle contains no prototype or dev bypass
        run: |
          ! grep -R "Prototype demo" apps/web/dist || (echo "prototype text leaked into production" && exit 1)
          ! grep -R "x-pagelet-dev" apps/web/dist api/dist || (echo "dev header bypass present" && exit 1)
